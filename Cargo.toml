[workspace]
resolver = "3"
members = [
  "budget2-web",
  "macros",
  "model",
  "static_files",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
description = "An app that helps you get an overview of your finances and budget."
homepage = "https://github.com/jhthorsen/budget2"
repository = "https://github.com/jhthorsen/budget2.git"
license = "MIT"
readme = "README.md"
keywords = ["finance", "web", "rust"]
categories = ["web-programming", "finance"]
authors = [
  "Jan Henning Thorsen <jan.henning@thorsenlabs.com>"
]

[workspace.dependencies]
macros = { path = "./macros" }
model = { path = "./model" }
static_files = { path = "./static_files" }
askama = "0.15"
axum = { version = "0.7", features = ["macros", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dotenv = "0.15"
oauth2 = "4.4"
rand = "0.9"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.12", features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
