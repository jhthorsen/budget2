name: Docker image

on:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - id: tag
        name: Check tag
        shell: bash
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == "refs/heads/release" ]]; then
            printf 'valid=true\nversion=latest\nimage=%s\n' "$image" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf 'valid=true\nversion=%s\nimage=%s\n' "$version" "$image" >> "$GITHUB_OUTPUT"
          else
            printf 'valid=false\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.tag.outputs.valid == 'true'

      - name: Build image
        if: steps.tag.outputs.valid == 'true'
        run: docker build --tag "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}" .

      - name: Log in to GHCR
        if: steps.tag.outputs.valid == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: steps.tag.outputs.valid == 'true'
        run: docker push "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}"
