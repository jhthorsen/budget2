<dialog id="dialog" open data-swap="morph:#dialog">
  <article>
    <header>
      <h2>Import transactions</h2>
    </header>
    <p>
      Upload a CSV file, then map its columns to your transactions.
      Required: a header row, date, description, and income or expense amount column.
    </p>
    <form id="import_form" action="/import/upload" method="post" enctype="multipart/form-data" data-history="none">
      <label for="csv_file">CSV file</label>
      <input id="csv_file" name="csv_file" type="file" accept=".csv,text/csv" required>
    </form>
    <footer>
      <button type="submit" form="import_form">Start import</button>
      <button type="button" class="secondary" on:load on:click="el.closest('dialog').close()">Cancel</button>
    </footer>
  </article>
</dialog>
