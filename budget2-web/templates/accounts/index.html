{% extends "layouts/base.html" %}

{% block title %}Accounts{% endblock %}

{% block content %}
<article>
  <header>
    <h1>Accounts</h1>
    <p>Accounts are created automatically when you import transactions.</p>
  </header>

  <section>
    {% if accounts.is_empty() %}
    <p>No accounts exists.</p>
    {% else %}
    <figure>
      <table>
        <thead>
          <tr>
            <th class="narrow">Name</th>
            <th class="narrow">Friendly name</th>
            <th class="narrow">Owner</th>
            <th>Description</th>
            <th class="narrow">Edit</th>
          </tr>
        </thead>
        <tbody>
          {% for account in accounts %}
          <tr>
            <td class="narrow"><a href="/dashboard?account={{ account.id }}">{{ account.name }}</a></td>
            <td class="narrow">{{ account.friendly }}</td>
            <td class="narrow">{% if account.owner_name.is_empty() %}{{ account.owner_email }}{% else %}{{
              account.owner_name }}{%
              endif %}</td>
            <td>{{ account.description }}</td>
            <td class="narrow"><a href="/accounts/{{ account.id }}" data-history="none">Edit</a></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </figure>
    {% endif %}
  </section>
</article>
{% endblock %}
