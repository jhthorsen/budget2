{% extends "layouts/base.html" %}

{% block title %}Categories{% endblock %}

{% block content %}
<article>
  <header>
    <a href="/categories/0" data-history="none" role="button" style="float:right">Add category</a>
    <h1>Categories</h1>
  </header>

  <section>
    {% if categories.is_empty() %}
    <p>No categories exists.</p>
    {% else %}
    <figure>
      <table>
        <thead>
          <tr>
            <th class="narrow">Name</th>
            <th>Description</th>
            <th class="narrow">Edit</th>
          </tr>
        </thead>
        <tbody>
          {% for category in categories %}
          <tr>
            <td class="narrow"><a href="/dashboard?category={{ category.id }}">{{ category.name }}</a></td>
            <td>{{ category.description }}</td>
            <td class="narrow"><a href="/categories/{{ category.id }}" data-history="none">Edit</a></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </figure>
    {% endif %}
  </section>
</article>
{% endblock %}
