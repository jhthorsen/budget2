{% extends "layouts/base.html" %}
{% block title %}Dashboard - Budget App{% endblock %}

{% block content %}
<article>
  <header>
    <h1>📊 Dashboard</h1>
  </header>

  {% include "dashboard/stacked_bar_chart.html" %}

  <form method="get" action="/dashboard?filtered=true" id="form_filter">
    <input type="hidden" name="page" value="1">
    <!-- more fields are inside the table -->
  </form>

  <figure style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th style="min-width:9rem">Date</th>
          <th style="width:80%">Description</th>
          <th style="min-width:8rem">Account</th>
          <th style="min-width:8rem">Category</th>
          <th style="min-width:7rem;text-align:right">Amount</th>
        </tr>
      </thead>
      <thead id="form_filter_fields" data-preserve>
        <tr>
          <th>
            <input form="form_filter" type="month" name="month" placeholder="YYYY-MM" value="{{ filters.month }}" data-init on:change="loadTransactions(el)">
          </th>
          <th>
            <input form="form_filter" type="text" name="search" placeholder="Search..." value="{{ filters.search }}" data-init on:keyup="@debounce(loadTransactions(el), 400)">
          </th>
          <th>
            <select form="form_filter" name="account_id" data-init on:change="loadTransactions(el)">
              <option value="0">Any</option>
              {% for account in accounts %}
                <option value="{{ account.id }}" {% if filters.account_id == account.id %}selected{% endif %}>{{ account.name }}</option>
              {% endfor %}
            </select>
          </th>
          <th>
            <select form="form_filter" name="category_id" data-init on:change="loadTransactions(el)">
              <option value="0" {% if filters.category_id == 0 %}selected{% endif %}>Any</option>
              <option value="-1" {% if filters.category_id == -1 %}selected{% endif %}>No Category</option>
              {% for category in categories %}
                <option value="{{ category.id }}" {% if filters.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
              {% endfor %}
            </select>
          </th>
          <th style="text-align:right">
            <select form="form_filter" name="transaction_type" data-init on:change="loadTransactions(el)">
              <option value="" {% if filters.transaction_type == "" %}selected{% endif %}>Any</option>
              <option value="income" {% if filters.transaction_type == "income" %}selected{% endif %}>Income</option>
              <option value="expense" {% if filters.transaction_type == "expense" %}selected{% endif %}>Expense</option>
            </select>
          </th>
        </tr>
      </thead>

      {% include "dashboard/transactions_table_body.html" %}
    </table>
  </figure>
</article>
<script nonce="{{ ctx.nonce }}">
  function loadTransactions($el) {
    $el.form.page.value = '1';
    $el.form.requestSubmit()
  }
</script>
{% endblock %}
