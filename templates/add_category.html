<article>
  <h1>Add Category</h1>
  <form action="/categories" method="post">
    <label>
      Name
      <input type="text" name="name" required placeholder="Enter category name">
    </label>
    <label>
      Color (optional)
      <input type="color" name="color" placeholder="#000000">
    </label>
    <button type="submit">Add Category</button>
  </form>
</article>
